name: Deploy simulator to Pages
on:
  push:
    branches: [main]
    paths: ["simulator/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: simulator
        continue-on-error: true
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
